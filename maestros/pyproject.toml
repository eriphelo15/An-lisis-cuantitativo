[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maestros"
version = "0.1.0"
description = "Cartera de algoritmos de small caps basados en el método documentado de traders reconocidos"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["maestros*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
